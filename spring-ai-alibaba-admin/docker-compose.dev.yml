# docker-compose.dev.yml — Spring AI Alibaba Admin 本地开发环境
#
# 一键启动全部依赖中间件，替代手动安装脚本。
#
# 用法：
#   docker compose -f docker-compose.dev.yml up -d          # 启动全部
#   docker compose -f docker-compose.dev.yml up -d mysql redis  # 只启动指定服务
#   docker compose -f docker-compose.dev.yml ps             # 查看状态
#   docker compose -f docker-compose.dev.yml logs -f        # 跟踪日志
#   docker compose -f docker-compose.dev.yml down           # 停止并移除容器
#   docker compose -f docker-compose.dev.yml down -v        # 停止并删除数据卷
#
# 首次启动会自动执行建库 SQL 和 ES 索引初始化，数据持久化到 Docker volume。
# 端口与 env-checklist.md 保持一致，宿主机可直接 localhost 访问。

services:

  # ─────────────────────────────────────────────────────
  # MySQL 8.0
  # 端口: 3306  账号: admin/admin  库: admin
  # ─────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.35
    container_name: saa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      LANG: C.UTF-8
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/middleware/init/mysql/admin-schema.sql:/docker-entrypoint-initdb.d/01-admin-schema.sql:ro
      - ./docker/middleware/init/mysql/agentscope-schema.sql:/docker-entrypoint-initdb.d/02-agentscope-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # Redis 7.2
  # 端口: 6379  无密码
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7.2.5
    container_name: saa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # Elasticsearch 9.1
  # 端口: 9200 (HTTP), 9300 (transport)
  # 单节点、关闭安全认证、loongsuite_traces 索引自动创建
  # ─────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    container_name: saa-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=es-cluster
      - node.name=es-node-1
      - bootstrap.memory_lock=true
      - http.cors.enabled=true
      - http.cors.allow-origin=*
      - action.destructive_requires_name=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - saa-net

  # ES 索引初始化（一次性容器，创建 pipeline + loongsuite_traces 索引）
  elasticsearch-init:
    image: curlimages/curl:latest
    container_name: saa-es-init
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/middleware/init/elasticsearch/init-indices.sh:/scripts/init-indices.sh:ro
    working_dir: /scripts
    entrypoint: ["sh", "init-indices.sh"]
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # Kibana 9.1（可选，用于查看 Trace 数据）
  # 端口: 5601
  # ─────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.2
    container_name: saa-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles:
      - observability
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # LoongCollector 3.1（可选，OTLP 接收器）
  # 端口: 4318 (OTLP HTTP)
  # ─────────────────────────────────────────────────────
  loongcollector:
    image: sls-opensource-registry.cn-shanghai.cr.aliyuncs.com/loongcollector-community-edition/loongcollector:3.1.4
    container_name: saa-loongcollector
    restart: unless-stopped
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    volumes:
      - ./docker/middleware/conf/loongcollector:/usr/local/loongcollector/conf/continuous_pipeline_config/local:ro
    ports:
      - "4318:4318"
    profiles:
      - observability
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # Nacos 3.0（服务发现 + 动态配置 + A2A 注册）
  # 端口: 8848 (HTTP API), 9848 (gRPC client)
  # 控制台: http://localhost:8848/nacos  账号: nacos/nacos
  # ─────────────────────────────────────────────────────
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: saa-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - NACOS_AUTH_TOKEN=dG9rZW5hbHNka2ZqbGFza2RqZmxhc2tkamZsYXNrZGpmb3dpZWpmbztzZGxm
      - NACOS_AUTH_IDENTITY_KEY=admin
      - NACOS_AUTH_IDENTITY_VALUE=admin
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # RocketMQ 5.3 — NameServer
  # 端口: 9876
  # ─────────────────────────────────────────────────────
  rmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: saa-rmq-namesrv
    restart: unless-stopped
    environment:
      - JAVA_OPT_EXT=-Xms128m -Xmx256m
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # RocketMQ 5.3 — Broker
  # 端口: 10911 (broker), 10909 (ha)
  # ─────────────────────────────────────────────────────
  rmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: saa-rmq-broker
    restart: unless-stopped
    environment:
      - NAMESRV_ADDR=rmq-namesrv:9876
      - JAVA_OPT_EXT=-Xms256m -Xmx512m
    volumes:
      - rmq_store:/home/rocketmq/store
    ports:
      - "10909:10909"
      - "10911:10911"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
    command: sh mqbroker
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # RocketMQ 5.3 — Proxy (gRPC REST 端点)
  # 端口: 18080 (remoting), 18081 (gRPC)
  # ─────────────────────────────────────────────────────
  rmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: saa-rmq-proxy
    restart: unless-stopped
    environment:
      - NAMESRV_ADDR=rmq-namesrv:9876
      - JAVA_OPT_EXT=-Xms128m -Xmx256m
    ports:
      - "18080:18080"
      - "18081:18081"
    depends_on:
      rmq-broker:
        condition: service_healthy
    volumes:
      - ./docker/middleware/conf/rocketmq:/home/rocketmq/conf:ro
    command: sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 18080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - saa-net

  # ─────────────────────────────────────────────────────
  # RocketMQ Topic 初始化（一次性容器）
  # 创建 topic_saa_studio_document_index + consumer group
  # ─────────────────────────────────────────────────────
  rmq-init-topic:
    image: apache/rocketmq:5.3.2
    container_name: saa-rmq-init-topic
    restart: "no"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
      rmq-broker:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Waiting for RocketMQ Broker to accept commands...' &&
        sleep 30 &&
        until sh mqadmin clusterList -n rmq-namesrv:9876 2>/dev/null; do
          echo 'Broker not ready, retrying in 10s...' &&
          sleep 10
        done &&
        echo 'Creating topic...' &&
        sh mqadmin updateTopic -n rmq-namesrv:9876 -t topic_saa_studio_document_index -c DefaultCluster -a +message.type=NORMAL &&
        sh mqadmin updateSubGroup -n rmq-namesrv:9876 -g group_saa_studio_document_index -c DefaultCluster &&
        echo 'Topic + ConsumerGroup created successfully'
      "
    networks:
      - saa-net

# ─────────────────────────────────────────────────────────
# 数据卷
# ─────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  nacos_data:
    driver: local
  nacos_logs:
    driver: local
  rmq_store:
    driver: local

# ─────────────────────────────────────────────────────────
# 网络
# ─────────────────────────────────────────────────────────
networks:
  saa-net:
    driver: bridge
