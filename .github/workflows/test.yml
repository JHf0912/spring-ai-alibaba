# .github/workflows/test.yml — Spring AI Alibaba Admin CI
#
# 两个 Job：
#   1. unit-test         — 不需要中间件，排除 *CharacterizationTest
#   2. integration-test  — 需要 MySQL + Redis + ES + Nacos + RocketMQ，只跑 *CharacterizationTest
#
# 中间件配置参考 spring-ai-alibaba-admin/docker-compose.dev.yml
# 踩坑记录见 spring-ai-alibaba-admin/docs/snags/snags.md

name: Admin Test

on:
  push:
    branches: ["**"]
    paths:
      - "spring-ai-alibaba-admin/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "spring-ai-alibaba-admin/**"
      - ".github/workflows/test.yml"

concurrency:
  group: admin-test-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ADMIN_DIR: spring-ai-alibaba-admin

jobs:
  # ═══════════════════════════════════════════════════════
  # Job 1: 单元测试（不需要中间件）
  # ═══════════════════════════════════════════════════════
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.ADMIN_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean test -Dtest='!*CharacterizationTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "${{ env.ADMIN_DIR }}/**/target/surefire-reports/"
          retention-days: 14

  # ═══════════════════════════════════════════════════════
  # Job 2: 集成测试（需要全部中间件 + 应用启动）
  # ═══════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.ADMIN_DIR }}

    # ── GitHub Actions 原生 Service 容器（MySQL / Redis / ES）──
    services:
      mysql:
        image: mysql:8.0.35
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

      redis:
        image: redis:7.2.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          cluster.name: es-cluster
          node.name: es-node-1
          action.destructive_requires_name: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=60s

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ── 中间件初始化 ──

      - name: Init MySQL schema
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1" 2>/dev/null && break
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -u root -proot admin < docker/middleware/init/mysql/admin-schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot admin < docker/middleware/init/mysql/agentscope-schema.sql
          echo "MySQL: $(mysql -h 127.0.0.1 -P 3306 -u root -proot admin -e 'SHOW TABLES' 2>/dev/null | wc -l) tables"

      - name: Init Elasticsearch index
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9200/_cluster/health && break
            sleep 3
          done
          curl -sf -X PUT "http://localhost:9200/_ingest/pipeline/parsing_loongsuite_traces" \
            -H "Content-Type: application/json" \
            -d '{"processors":[{"json":{"field":"contents.attribute","target_field":"attributes"}},{"json":{"field":"contents.resource","target_field":"resources"}},{"json":{"field":"contents.links","target_field":"spanLinks"}},{"json":{"field":"contents.logs","target_field":"spanEvents"}},{"remove":{"field":["contents.attribute","contents.resource","contents.links","contents.logs"]}},{"rename":{"field":"contents","target_field":"metadata"}},{"script":{"source":"Map usage = new HashMap();long total = 0;if (ctx.attributes.containsKey(\"gen_ai.usage.input_tokens\")) {long input = Long.parseLong(ctx.attributes[\"gen_ai.usage.input_tokens\"]);usage[\"input_tokens\"] = input;total = total + input;}if (ctx.attributes.containsKey(\"gen_ai.usage.output_tokens\")) {long output = Long.parseLong(ctx.attributes[\"gen_ai.usage.output_tokens\"]);usage[\"output_tokens\"] = output;total = total + output;}usage[\"total_tokens\"] = total;ctx.usage = usage;"}}]}'
          curl -sf -X PUT "http://localhost:9200/loongsuite_traces" \
            -H "Content-Type: application/json" \
            -d '{"settings":{"index.default_pipeline":"parsing_loongsuite_traces"},"mappings":{"dynamic":"false","properties":{"metadata":{"type":"object"},"attributes":{"type":"flattened"},"resources":{"type":"flattened"},"usage":{"type":"object"}}}}'
          echo "ES index initialized"

      - name: Start Nacos 3.0
        run: |
          docker run -d --name saa-nacos \
            -p 8848:8848 -p 9848:9848 \
            -e MODE=standalone \
            -e JVM_XMS=256m \
            -e JVM_XMX=512m \
            -e NACOS_AUTH_TOKEN=dG9rZW5hbHNka2ZqbGFza2RqZmxhc2tkamZsYXNrZGpmb3dpZWpmbztzZGxm \
            -e NACOS_AUTH_IDENTITY_KEY=admin \
            -e NACOS_AUTH_IDENTITY_VALUE=admin \
            nacos/nacos-server:v3.0.3
          for i in $(seq 1 30); do
            curl -sf http://localhost:8848/nacos/ && break
            sleep 3
          done
          echo "Nacos started"

      - name: Start RocketMQ 5.3
        run: |
          docker network create rmq-net 2>/dev/null || true

          # NameServer
          docker run -d --name saa-rmq-namesrv --network rmq-net -p 9876:9876 \
            -e JAVA_OPT_EXT="-Xms128m -Xmx256m" apache/rocketmq:5.3.2 sh mqnamesrv
          for i in $(seq 1 20); do
            docker exec saa-rmq-namesrv sh mqadmin clusterList -n localhost:9876 2>/dev/null && break
            sleep 3
          done
          echo "NameServer ready"

          # Broker
          docker run -d --name saa-rmq-broker --network rmq-net -p 10911:10911 \
            -e NAMESRV_ADDR=saa-rmq-namesrv:9876 -e JAVA_OPT_EXT="-Xms256m -Xmx512m" \
            apache/rocketmq:5.3.2 sh mqbroker
          for i in $(seq 1 20); do
            docker exec saa-rmq-broker sh mqadmin clusterList -n saa-rmq-namesrv:9876 2>/dev/null && break
            sleep 3
          done
          echo "Broker ready"

          # 创建应用需要的 Topic 和 ConsumerGroup
          docker exec saa-rmq-broker sh mqadmin updateTopic -n saa-rmq-namesrv:9876 \
            -t topic_saa_studio_document_index -c DefaultCluster 2>/dev/null || true
          docker exec saa-rmq-broker sh mqadmin updateSubGroup -n saa-rmq-namesrv:9876 \
            -g group_saa_studio_document_index -c DefaultCluster 2>/dev/null || true

          # Proxy（等 Broker 完全就绪后再启动，挂载配置文件禁用 TLS）
          docker run -d --name saa-rmq-proxy --network rmq-net -p 18080:18080 -p 18081:18081 \
            -e NAMESRV_ADDR=saa-rmq-namesrv:9876 -e JAVA_OPT_EXT="-Xms128m -Xmx256m" \
            -v $(pwd)/docker/middleware/conf/rocketmq:/home/rocketmq/conf:ro \
            apache/rocketmq:5.3.2 sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json

          # 等 Proxy TCP 端口打开
          echo "Waiting for RocketMQ Proxy TCP..."
          for i in $(seq 1 30); do
            nc -z localhost 18080 2>/dev/null && break
            sleep 3
          done
          nc -z localhost 18080 || { echo "Proxy TCP port not open"; docker logs saa-rmq-proxy; exit 1; }

          # TCP 端口打开后，gRPC 服务还需要额外初始化时间（10-30s）
          # 注意：不能用 mqadmin topicList 通过 Proxy 检测，因为 gRPC 未就绪时命令会挂起
          # 直接等待固定时间，应用自身有重试机制
          echo "Waiting 30s for Proxy gRPC initialization..."
          sleep 30
          echo "RocketMQ fully started"

      # ── 构建 ──

      - name: Build admin project
        run: mvn -B clean package -DskipTests=true

      # ── 中间件就绪验证 ──

      - name: Verify middleware readiness
        run: |
          echo "=== Middleware Check ==="
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1" || { echo "MySQL FAIL"; exit 1; }
          echo "  MySQL       OK"
          nc -z localhost 6379 || { echo "Redis FAIL"; exit 1; }
          echo "  Redis       OK"
          curl -sf http://localhost:9200/_cluster/health || { echo "ES FAIL"; exit 1; }
          echo "  ES          OK"
          curl -sf http://localhost:8848/nacos/ || { echo "Nacos FAIL"; exit 1; }
          echo "  Nacos       OK"
          nc -z localhost 9876 || { echo "RMQ NameSrv FAIL"; exit 1; }
          echo "  RMQ NameSrv OK"
          nc -z localhost 10911 || { echo "RMQ Broker FAIL"; exit 1; }
          echo "  RMQ Broker  OK"
          nc -z localhost 18080 || { echo "RMQ Proxy FAIL"; exit 1; }
          echo "  RMQ Proxy   OK"
          echo ""
          echo "=== Docker Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}" | grep saa-

      # ── 启动应用 ──

      - name: Start application
        run: |
          # 环境变量（YAML ${VAR} 占位符需要 export，不是 -D）
          export SPRING_DATASOURCE_URL="jdbc:mysql://localhost:3306/admin?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
          export SPRING_DATASOURCE_USERNAME=root
          export SPRING_DATASOURCE_PASSWORD=root
          export SPRING_REDIS_HOST=localhost
          export SPRING_REDIS_PORT=6379
          export SPRING_ELASTICSEARCH_URIS=http://localhost:9200
          export NACOS_SERVER_ADDR=localhost:8848
          export ROCKETMQ_ENDPOINTS=localhost:18080
          export MANAGEMENT_OTLP_TRACING_EXPORT_ENDPOINT=http://localhost:4318/v1/traces

          java -Dserver.port=8081 \
            -jar spring-ai-alibaba-admin-server-start/target/spring-ai-alibaba-admin-server-start.jar \
            > /tmp/saa-admin.log 2>&1 &
          APP_PID=$!
          echo $APP_PID > /tmp/saa-app.pid
          echo "App PID: $APP_PID"

          # 等待健康检查通过（同时监控进程存活）
          for i in $(seq 1 60); do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "=== Application died during startup! ==="
              tail -100 /tmp/saa-admin.log
              exit 1
            fi
            if curl -sf http://localhost:8081/console/v1/system/health 2>/dev/null | grep -q "ok"; then
              echo "Health check passed at $((i*3))s"
              break
            fi
            sleep 3
          done

          # 稳定性验证（确保不会启动后崩溃）
          sleep 10
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "=== Application crashed after health check! ==="
            tail -100 /tmp/saa-admin.log
            exit 1
          fi
          curl -sf http://localhost:8081/console/v1/system/health || { echo "App not stable"; tail -100 /tmp/saa-admin.log; exit 1; }
          echo "Application stable and ready"

      # ── 运行集成测试 ──

      - name: Run characterization tests
        env:
          TEST_BASE_URL: http://localhost:8081
        run: |
          # 测试前确认应用活着
          APP_PID=$(cat /tmp/saa-app.pid 2>/dev/null)
          if [ -n "$APP_PID" ] && ! kill -0 $APP_PID 2>/dev/null; then
            echo "Application died before tests!"
            tail -80 /tmp/saa-admin.log
            exit 1
          fi

          mvn -pl spring-ai-alibaba-admin-server-start -am -B test \
            -Dtest='*CharacterizationTest' \
            -Dsurefire.failIfNoSpecifiedTests=false

      # ── 产物上传 ──

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: "${{ env.ADMIN_DIR }}/**/target/surefire-reports/"
          retention-days: 14

      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: /tmp/saa-admin.log
          retention-days: 7
